<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Webverse</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                Webverse Hub
            </a>
        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main class="container py-4">

        <div class="row g-4 justify-content-center">

            <!-- ADD USER -->
            <div class="col-lg-5">

                <div class="card shadow-sm">
                    <div class="card-body">

                        <h5 class="card-title">
                            Webverse Staff
                        </h5>

                        <form id="userForm">

                            <!-- Name -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Name
                                </label>

                                <input
                                    class="form-control"
                                    name="name"
                                    type="text"
                                    required>
                            </div>


                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    class="form-control"
                                    name="email"
                                    type="email"
                                    required>
                            </div>


                          

                            <!-- Age -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Age (optional)
                                </label>

                                <input
                                    class="form-control"
                                    name="age"
                                    type="number"
                                    min="1">
                            </div>


                            <!-- Save -->
                            <button
                                class="btn btn-primary w-100"
                                type="submit">
                                Save
                            </button>

                        </form>

                        <div id="msg" class="mt-3"></div>

                    </div>
                </div>

            </div>


            <!-- USER LIST -->
            <div class="col-lg-7">

                <div class="card shadow-sm">
                    <div class="card-body">

                        <h5 class="card-title">
                            Webverse Staff List
                        </h5>

                        <div
                            id="userList"
                            class="list-group small">
                        </div>

                    </div>
                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        © 2026 Yohance Gwen S.Raule. All Rights Reserved.
    </footer>


    <!-- JAVASCRIPT -->
    <script src="/js/app.js"></script>

</body>
</html>
